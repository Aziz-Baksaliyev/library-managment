<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav>
    <div>
        <a th:href="@{/library/books}">Books</a>
        <a th:href="@{/library/authors}">Authors</a>
    </div>
</nav>

<div>
    <a th:href="@{/books/create}">+Book</a>
</div>

<div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Price</th>
            <th>Author</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.genre}"></td>
            <td th:text="${book.price}"></td>
            <td th:text="${book.author.fullname}"></td>

            <td>
                <div>
                    <a href="@{/library/books/edit/{id}(id=${book.id})}">Edit</a>

                    <form th:action="@{/library/books/{id}/delete(id=${book.id})}" method="post">
                        <button type="submit" onclick="return confirm('Delete this book?')">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
    </tbody>
</table>

    <p th:if="${#lists.isEmpty(books)}">No Books Found? Add New Book.</p>
</div>
</body>
</html>
