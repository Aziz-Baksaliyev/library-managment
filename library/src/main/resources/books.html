<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Form</title>
</head>
<body>

<nav>
    <div>
        <a th:href="@{/library/books}">Books</a>
        <a th:href="@{/library/authors}">Authors</a>
    </div>
</nav>

<div>
    <a th:href="@{/library/books/add}">+Book</a>
</div>

<div>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Genre</th>
                <th>Price</th>
                <th>Author</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.genre}"></td>
                <td th:text="${book.price}"></td>
                <td th:text="${book.authorName}"></td>

                <td>
                    <div>
                        <a th:href="@{/library/books/{id}/edit(id=${book.id})}">Edit</a>

                        <form th:action="@{/library/books/{id}/delete(id=${book.id})}" method="post">
                            <button type="submit" onclick="return confirm('Delete This Book?')">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(books}">No Books Found! Add New book</p>
</div>
</body>
</html>
